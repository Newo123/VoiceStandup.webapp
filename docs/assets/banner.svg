<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#302b63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#24243e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="microGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow1" cx="10%" cy="90%" r="40%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="10%" r="40%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="30%">
      <stop offset="0%" style="stop-color:#533483;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#533483;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Фон -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  
  <!-- Glow-эффекты -->
  <rect width="1200" height="400" fill="url(#glow1)"/>
  <rect width="1200" height="400" fill="url(#glow2)"/>
  <rect width="1200" height="400" fill="url(#glow3)"/>

  <!-- Декоративные круги -->
  <circle cx="100" cy="350" r="200" fill="#e94560" opacity="0.05"/>
  <circle cx="1100" cy="50" r="250" fill="#ff6b35" opacity="0.05"/>
  <circle cx="600" cy="200" r="180" fill="#533483" opacity="0.05"/>
  
  <circle cx="80" cy="80" r="3" fill="#e94560" opacity="0.3"/>
  <circle cx="1120" cy="320" r="4" fill="#ff6b35" opacity="0.3"/>
  <circle cx="600" cy="30" r="2" fill="#a8b2d1" opacity="0.2"/>
  <circle cx="150" cy="50" r="2" fill="#a8b2d1" opacity="0.2"/>
  <circle cx="1050" cy="370" r="3" fill="#a8b2d1" opacity="0.2"/>

  <!-- Иконка микрофона -->
  <g transform="translate(130, 160)">
    <!-- Тень -->
    <ellipse cx="30" cy="155" rx="35" ry="8" fill="#000" opacity="0.3"/>
    
    <!-- Корпус микрофона -->
    <rect x="10" y="30" width="40" height="70" rx="20" fill="url(#microGrad)" opacity="0.9"/>
    <rect x="10" y="30" width="40" height="70" rx="20" fill="none" stroke="#fff" stroke-width="1" opacity="0.1"/>
    
    <!-- Сетка микрофона -->
    <rect x="15" y="35" width="30" height="25" rx="12" fill="#fff" opacity="0.15"/>
    <line x1="18" y1="42" x2="42" y2="42" stroke="#fff" stroke-width="0.5" opacity="0.3"/>
    <line x1="18" y1="47" x2="42" y2="47" stroke="#fff" stroke-width="0.5" opacity="0.3"/>
    <line x1="18" y1="52" x2="42" y2="52" stroke="#fff" stroke-width="0.5" opacity="0.3"/>
    
    <!-- Держатель -->
    <rect x="25" y="100" width="10" height="20" rx="3" fill="#fff" opacity="0.3"/>
    <rect x="15" y="120" width="30" height="8" rx="4" fill="#fff" opacity="0.2"/>
    
    <!-- Кольцо -->
    <circle cx="30" cy="130" r="18" fill="none" stroke="#e94560" stroke-width="3" opacity="0.6"/>
    <circle cx="30" cy="130" r="18" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Основной заголовок -->
  <text x="270" y="155" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-2">
    Voice Standup
  </text>

  <!-- Подзаголовок -->
  <text x="270" y="205" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="400" fill="#a8b2d1" letter-spacing="0.5">
    Telegram Mini App для stand‑up отчётов
  </text>

  <!-- Акцентная линия -->
  <rect x="270" y="225" width="180" height="4" rx="2" fill="url(#accentGrad)"/>

  <!-- Бейджи технологий -->
  <g transform="translate(270, 255)">
    <!-- React -->
    <rect x="0" y="0" width="95" height="32" rx="16" fill="#61DAFB" opacity="0.15"/>
    <rect x="0" y="0" width="95" height="32" rx="16" fill="none" stroke="#61DAFB" stroke-width="1" opacity="0.3"/>
    <text x="47" y="21" font-family="Geist, system-ui, sans-serif" font-size="13" font-weight="600" fill="#61DAFB" text-anchor="middle">React 19</text>

    <!-- TypeScript -->
    <rect x="110" y="0" width="105" height="32" rx="16" fill="#3178C6" opacity="0.15"/>
    <rect x="110" y="0" width="105" height="32" rx="16" fill="none" stroke="#3178C6" stroke-width="1" opacity="0.3"/>
    <text x="162" y="21" font-family="Geist, system-ui, sans-serif" font-size="13" font-weight="600" fill="#3178C6" text-anchor="middle">TypeScript</text>

    <!-- Vite -->
    <rect x="230" y="0" width="85" height="32" rx="16" fill="#646CFF" opacity="0.15"/>
    <rect x="230" y="0" width="85" height="32" rx="16" fill="none" stroke="#646CFF" stroke-width="1" opacity="0.3"/>
    <text x="272" y="21" font-family="Geist, system-ui, sans-serif" font-size="13" font-weight="600" fill="#646CFF" text-anchor="middle">Vite</text>

    <!-- Tailwind -->
    <rect x="330" y="0" width="100" height="32" rx="16" fill="#06B6D4" opacity="0.15"/>
    <rect x="330" y="0" width="100" height="32" rx="16" fill="none" stroke="#06B6D4" stroke-width="1" opacity="0.3"/>
    <text x="380" y="21" font-family="Geist, system-ui, sans-serif" font-size="13" font-weight="600" fill="#06B6D4" text-anchor="middle">Tailwind</text>

    <!-- TanStack -->
    <rect x="445" y="0" width="120" height="32" rx="16" fill="#FF4154" opacity="0.15"/>
    <rect x="445" y="0" width="120" height="32" rx="16" fill="none" stroke="#FF4154" stroke-width="1" opacity="0.3"/>
    <text x="505" y="21" font-family="Geist, system-ui, sans-serif" font-size="13" font-weight="600" fill="#FF4154" text-anchor="middle">TanStack Query</text>

    <!-- Telegram -->
    <rect x="580" y="0" width="105" height="32" rx="16" fill="#26A5E4" opacity="0.15"/>
    <rect x="580" y="0" width="105" height="32" rx="16" fill="none" stroke="#26A5E4" stroke-width="1" opacity="0.3"/>
    <text x="632" y="21" font-family="Geist, system-ui, sans-serif" font-size="13" font-weight="600" fill="#26A5E4" text-anchor="middle">Telegram</text>

    <!-- Vercel -->
    <rect x="700" y="0" width="95" height="32" rx="16" fill="#ffffff" opacity="0.1"/>
    <rect x="700" y="0" width="95" height="32" rx="16" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
    <text x="747" y="21" font-family="Geist, system-ui, sans-serif" font-size="13" font-weight="600" fill="#a8b2d1" text-anchor="middle">Vercel</text>
  </g>

  <!-- Декоративная звёздочка/волна -->
  <g transform="translate(1080, 320)" opacity="0.3">
    <path d="M0,0 Q10,-15 20,0 Q30,15 40,0" stroke="#e94560" stroke-width="2" fill="none"/>
    <path d="M0,8 Q10,-7 20,8 Q30,23 40,8" stroke="#ff6b35" stroke-width="2" fill="none"/>
    <path d="M0,16 Q10,1 20,16 Q30,31 40,16" stroke="#533483" stroke-width="2" fill="none"/>
  </g>

  <!-- Статус "MVP" -->
  <g transform="translate(1080, 60)">
    <rect x="0" y="0" width="80" height="28" rx="14" fill="#e94560" opacity="0.2"/>
    <rect x="0" y="0" width="80" height="28" rx="14" fill="none" stroke="#e94560" stroke-width="1.5" opacity="0.4"/>
    <text x="40" y="19" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="700" fill="#e94560" text-anchor="middle" letter-spacing="1">🚧 MVP</text>
  </g>

  <!-- Версия -->
  <g transform="translate(1080, 105)">
    <text x="40" y="12" font-family="Geist, system-ui, sans-serif" font-size="11" fill="#a8b2d1" opacity="0.5" text-anchor="middle">v0.1.0</text>
  </g>
</svg>